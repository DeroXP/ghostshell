[package]
name = "vispora-shell"
# Not the app's version: that is read from config.py when this is built
# (build.rs here and in ../core), so that it is written in one place only.
version = "0.1.0"
edition = "2021"
description = "The shell that is to become Vispora.exe: the window around shell_rs/core"
license = "MIT"
publish = false

# Not named Vispora yet, on purpose: no exe of that name is ever started in a
# trial (the app's own is running on the PC the trials are made on).  The
# one-file piece gives it its name.
[[bin]]
name = "VisporaShell"
path = "src/main.rs"

[features]
default = ["elevated"]
# The build that is meant to ship: it asks for administrator rights when it
# is the first copy and does not have them (see ../core/src/instance.rs).
# Without this feature the exe never asks, and only runs as a trial: with a
# stand-in backend and names of its own (see try_it.py).
elevated = []
# Which of the two ways the backend is kept on the PC (../core/src/backend.rs).
# The owner chose (2026-11-25): it is unpacked once per version into a
# folder that stays (ProgramData\Vispora-backend-kept-<version>-...), and
# checked and used again at later starts.  That is what a build does that
# is told nothing, the build that ships among them.
# With this feature a build goes the other way: the backend is unpacked at
# every start into a folder for that run and taken away at the quit, so
# that nothing stays on the PC.  Both ways are built and tested; a trial
# says which one it wants through its own setting, whatever the build.
unpack-at-every-start = []

[dependencies]
vispora-shell-core = { path = "../core" }
tauri = { version = "=2.12.7", default-features = false, features = ["wry", "custom-protocol", "tray-icon"] }

[build-dependencies]
tauri-build = { version = "=2.7.6", default-features = false, features = ["config-json"] }
# The shell's own core, for the build script as well: it reads the pack
# whole before the exe is made (build.rs).  A crate of this repository
# without outside crates, and in the lock file already.
vispora-shell-core = { path = "../core" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
