# CI for the Railway-deployed backend in cloud/.
#
# Runs on every pull request and on pushes to main that touch cloud/.  Four
# independent jobs run in parallel (lint, tests against a real Postgres,
# dependency audit, Docker image build) and a single `ci-ok` gate job
# collects them, so branch protection only ever has to require one check.
#
# Supply-chain notes:
#   • Every action is pinned to a full commit SHA (the tag is a comment so
#     Dependabot can keep both in step).  A moved tag cannot change what runs.
#   • The workflow token is read-only (`permissions: contents: read`) and the
#     checkout does not persist it, so nothing in a PR can push or publish.
#   • Python dependencies install with --require-hashes from the compiled
#     requirements files; a tampered wheel fails the install.
name: cloud-ci

on:
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - ".github/workflows/cloud-ci.yml"
  pull_request:
    paths:
      - "cloud/**"
      - ".github/workflows/cloud-ci.yml"

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: cloud-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cloud

env:
  PYTHON_VERSION: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: cloud/requirements*.txt
      - name: Install dev tooling
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Ruff lint (includes the bandit security rule set)
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vispora
          POSTGRES_PASSWORD: vispora
          POSTGRES_DB: vispora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vispora -d vispora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Points the DB-backed tests at the throwaway service container above.
      TEST_DATABASE_URL: postgresql://vispora:vispora@localhost:5432/vispora_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: cloud/requirements*.txt
      - name: Install runtime + dev dependencies
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: cloud/requirements*.txt
      - name: Install the exact runtime dependency set
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Audit installed packages against known vulnerabilities
        # --strict also fails when a package could not be audited at all.
        run: pip-audit --strict --desc on

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the production image exactly as Railway will
        run: docker build --pull -t vispora-cloud:ci .
      - name: Image imports the app (no database needed for an import)
        run: docker run --rm -e APP_ENV=development vispora-cloud:ci python -c "import main; print('import ok:', main.app.title, main.app.version)"
      - name: Image does not run as root
        run: test "$(docker run --rm vispora-cloud:ci id -u)" != "0"

  # The one check to require in branch protection.  Succeeds only when every
  # job above succeeded; a skipped or cancelled job counts as a failure.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, test, audit, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "job results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*|*skipped*) echo "a required job did not succeed"; exit 1 ;;
          esac
