[package]
name = "vispora-native"
version = "0.1.0"
edition = "2021"
description = "Vispora's native helper: answers the app's hottest questions in-process instead of starting a program for each"
license = "MIT"
publish = false

[lib]
name = "vispora_native"
# cdylib: the DLL the Python app loads (core/native.py).
# rlib:   the same code as a Rust library, for the command-line tool below and,
#         later, for the Rust shell that replaces the Python start (docs/rust-port.md).
crate-type = ["cdylib", "rlib"]

# (Not named "vispora-native": its debug file would take the library's name.)
[[bin]]
name = "vispora-native-ask"
path = "src/main.rs"

# No dependencies, on purpose.  This library is loaded into a program that
# runs as administrator: it is built from the code in this folder and from
# Windows itself, and a build never downloads anything.
[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# A panic must never unwind into the Python process or abort it: every call is
# wrapped in catch_unwind (lib.rs), which needs unwinding.
panic = "unwind"
